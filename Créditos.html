<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La biblioteca de mi novia - Créditos 🌙✨</title>
    
    <!-- IMPORTACIÓN DE FUENTES AESTHETIC E ICONOS -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* === VARIABLES DE COLOR: NOCHE A TURQUESA === */
        :root {
            --noche-profunda: #030613;
            --azul-noche: #0a192f;
            --turquesa-profundo: #005a70;
            --turquesa-brillante: #00d2ff;
            --turquesa-claro: #a8f0ff;
            --blanco-cristal: rgba(255, 255, 255, 0.08);
            --borde-cristal: rgba(0, 210, 255, 0.3);
            --texto-claro: #f4f4f9;
        }

        /* --- 1. BASE Y FONDO --- */
        body {
            margin: 0;
            font-family: 'Nunito', sans-serif !important;
            color: var(--texto-claro);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Degradado Noche a Turquesa fijo (Vertical y centrado) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, 
                var(--noche-profunda) 0%, 
                var(--azul-noche) 40%, 
                var(--turquesa-profundo) 55%, 
                var(--turquesa-brillante) 100%);
            z-index: -2;
        }

        #contenido-protegido {
            display: none;
            flex: 1; /* Empuja el footer hacia abajo */
        }

        /* Animación de hojitas cayendo (Estilo Heartstopper en Turquesa) */
        .hoja {
            position: fixed;
            color: var(--turquesa-brillante);
            font-size: 1.5rem;
            animation: caer 10s linear infinite;
            z-index: -1;
            opacity: 0.5;
        }
        @keyframes caer {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        /* --- 2. MENÚ SUPERIOR (GLASSMORPHISM) --- */
        .menu-superior {
            background: rgba(3, 6, 19, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--texto-claro);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--borde-cristal);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }

        /* Ajustes en el logo para que funcione como enlace sin perder el estilo */
        .menu-superior .logo {
            font-family: 'Caveat', cursive !important;
            font-size: 32px;
            color: var(--turquesa-claro);
            text-shadow: 1px 1px 8px rgba(0, 210, 255, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .menu-superior .logo:hover {
            color: var(--turquesa-brillante);
        }

        .menu-superior ul {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0; padding: 0;
        }

        .menu-superior a {
            color: var(--texto-claro);
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .menu-superior a:hover {
            color: var(--turquesa-brillante);
        }

        /* --- 3. CABECERA Y TEXTOS --- */
        h1 {
            text-align: center;
            font-family: 'Caveat', cursive !important;
            font-size: clamp(40px, 8vw, 60px);
            margin: 50px 0 30px 0;
            color: var(--turquesa-claro);
            text-shadow: 2px 2px 15px rgba(0, 210, 255, 0.6);
            font-weight: 600;
        }

        /* --- 4. IMAGEN TIPO POLAROID --- */
        .polaroid-container {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }

        .polaroid {
            background: #ffffff;
            color: #333333;
            padding: 15px 15px 30px 15px;
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: rotate(-2deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            max-width: 90%;
            width: 350px; /* Tamaño más grande para destacar a Harry */
            text-align: center;
        }

        .polaroid:hover {
            transform: scale(1.05) rotate(0deg);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .polaroid img {
            width: 100%;
            height: auto;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        .polaroid p {
            font-family: 'Caveat', cursive;
            font-size: 28px;
            margin: 0;
            font-weight: 600;
        }

        /* --- 5. CONTENEDOR EFECTO CRISTAL --- */
        .contenedor_0 {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 50px;
            padding: 40px 30px;
            background: var(--blanco-cristal);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--borde-cristal);
            font-size: 20px;
            color: var(--texto-claro) !important;
            line-height: 1.6;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .contenedor_0 .nombre {
            font-family: 'Caveat', cursive;
            font-size: 40px;
            color: var(--turquesa-brillante);
            margin-bottom: 10px;
            display: block;
        }

        /* --- 6. FOOTER --- */
        footer {
            margin-top: auto;
            text-align: center;
            padding: 30px;
            font-size: 1.1rem;
            color: var(--texto-claro);
        }
        footer i { color: var(--turquesa-brillante); margin: 0 5px; }

        /* --- 7. AJUSTE MÓVIL --- */
        @media (max-width: 700px) {
            .menu-superior { padding: 15px; flex-direction: column; gap: 12px; }
            .contenedor_0 { width: 90%; padding: 25px 15px; }
        }
    </style>
</head>
<body>

    <!-- Animación de hojitas de fondo -->
    <i class="fas fa-leaf hoja" style="left: 20%; animation-duration: 14s;"></i>
    <i class="fas fa-leaf hoja" style="left: 60%; animation-duration: 11s; animation-delay: 2s;"></i>
    <i class="fas fa-leaf hoja" style="left: 85%; animation-duration: 16s; animation-delay: 4s;"></i>

    <div id="contenido-protegido">
        
        <!-- MENÚ SUPERIOR -->
        <nav class="menu-superior">
            <!-- LOGO CONVERTIDO EN ENLACE AL INDEX -->
            <a href="index.html" class="logo">Biblioteca de Mi Novia 🌙</a>
            <ul>
                <li><a href="index.html">Página Principal</a></li>
                <li><a href="Biblioteca_Tati_Pelis.html">Canciones</a></li>
                <!--<li><a href="Cartas.html">Cartas</a></li>-->
                <li><a href="Créditos.html">Créditos</a></li>
                <li><a href="Corazao.html">Regalo</a></li>
            </ul>
        </nav>

        <h1>CRÉDITOS ✨</h1>

        <!-- FOTO POLAROID -->
        <div class="polaroid-container">
            <div class="polaroid">
                <img src="archivos y fotos/harry styles.jpg" alt="Harry Styles">
                <p>Harry Styles 💖</p>
            </div>
        </div>

        <!-- CAJA DE TEXTO GLASSMORPHISM -->
        <div class="contenedor_0">
            <span class="nombre">Adrián (Lógicamente)</span>
            <p style="font-size: 16px; opacity: 0.8; font-weight: 300; margin-top: 15px;">
                & ChatGPT (tan solo dudas sobre cómo se hacían ciertas cosas, ¡aprendí a hacerlo todo con este proyecto!)
            </p>
        </div>

    </div>

    <!-- FOOTER -->
    <footer id="mi-footer" style="display: none;">
        <p>Hecho con <i class="fas fa-heart"></i> por tu bollito de crema</p>
    </footer>

    <script>
        // Verificación de acceso
        const contenido = document.getElementById('contenido-protegido');
        const footer = document.getElementById('mi-footer');

        if (sessionStorage.getItem('accesoPermitido') === 'true') {
            contenido.style.display = 'block';
            footer.style.display = 'block';
        } else {
            window.location.href = "index.html"; 
        }
    </script>
</body>
</html>
